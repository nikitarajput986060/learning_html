<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Row Span Example</title>

</head>
<body>
    <h3>Row Span Example</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Topic</th>
                <th>Duration</th>
                </tr>                    
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">Web Development</td>
                    <td>HTML</td>
                    <td>2 hours</td>

                </tr>
                <tr>
                    <td>CSS</td>
                    <td>3 hours</td>
                    </tr>
                <tr>
                    <td rowspan="2">Java</td>
                    <td>Core Java</td>
                    <td>4 hours</td>

                </tr>
                <tr>
                    <td>Advanced Java</td>
                    <td>5 hours</td>
                    </tr>
        </tbody>
        </body>
</html>
